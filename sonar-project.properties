# SonarCloud Configuration
sonar.projectKey=nicevolunteers
sonar.organization=your-organization

# Project Information
sonar.projectName=NiceVolunteers
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Encoding
sonar.sourceEncoding=UTF-8

# Java version
sonar.java.source=21

# JaCoCo Coverage Report Paths
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Exclusions
sonar.exclusions=**/config/**,**/dto/**,**/exception/**,**/*Application.java
sonar.test.exclusions=**/Test*.java,**/*Test.java,**/*Steps.java

# Code Smells & Duplications
sonar.cpd.exclusions=**/domain/**,**/dto/**
